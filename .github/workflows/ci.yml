# AEGIS CI (PROGRESS.md P0-18).
#
# Windows-only, because the product is (REMEMBER.md § 4) and because the core's
# actuation tests drive real Win32 hooks.
#
# The gate lives in `pnpm test`, not here: it already runs `gen:types:check`,
# every workspace suite, the root `node:test` scripts and `pytest`. This file
# only has to reproduce a developer's machine and run the same commands, so a
# check can never exist in CI and be skippable locally.
#
# The venv must be at `core/.venv`: the `py:*` scripts and `scripts/gen-types.ts`
# hard-code that path. `scripts/ci-workflow.test.ts` asserts it still matches.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, lint, typecheck, test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create the core venv
        working-directory: core
        run: python -m venv .venv

      - name: Install the core and its dev dependencies
        working-directory: core
        run: |
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e '.[dev]'

      - name: Build
        run: pnpm build

      - name: Lint (TypeScript)
        run: pnpm lint

      - name: Typecheck (TypeScript)
        run: pnpm typecheck

      - name: Lint (Python)
        run: pnpm py:lint

      - name: Typecheck (Python)
        run: pnpm py:typecheck

      - name: Test
        run: pnpm test
