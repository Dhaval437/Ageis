[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-core"
version = "0.0.0"
description = "AEGIS agent core — the Python sidecar that perceives, plans, and acts."
readme = "README.md"
# Target runtime is Python 3.11 (REMEMBER.md § 4). The upper bound keeps local
# dev on a version the packaged interpreter can also run.
requires-python = ">=3.11,<3.14"
license = { text = "UNLICENSED" }
dependencies = [
  "anyio>=4.0",      # task group behind WS /v1/stream (also starlette's runtime)
  "fastapi>=0.119",
  # The model adapters' HTTP client: async streaming with built-in, size-capped SSE.
  # Runtime, not dev, since P1-02 — starlette's TestClient also uses it.
  "httpx2>=2.12",
  # The key vault (P1-07). Only its Windows Credential Manager backend is ever used —
  # that is DPAPI at rest, invariant 9 — and `storage/vault.py` refuses any other.
  "keyring>=25.0",
  "psutil>=7.0",     # peer-PID check on connect (ARCHITECTURE.md § 3.1 step 5)
  "pydantic>=2.12",
  "uvicorn>=0.38",
  "websockets>=15.0", # uvicorn's WebSocket protocol; without it /v1/stream cannot upgrade
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18",
  "types-psutil>=7.0",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["aegis_core"]

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["aegis_core", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "PTH",  # flake8-use-pathlib
  "RUF",  # ruff-specific
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "ANN",  # flake8-annotations
]
ignore = [
  "ANN401",  # Any is occasionally unavoidable at ctypes boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test
# Win32 struct and field names are the ABI. Renaming them to satisfy pep8-naming
# would silently break the mapping, so this one file keeps Microsoft's spelling.
"aegis_core/actuation/win32.py" = ["N801", "N806", "N815", "N816"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict, no exceptions
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["aegis_core", "tests"]
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_unimported = true
show_error_codes = true
pretty = true
exclude = ['^\.venv/']

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = [
  "error",
  # Raised by starlette's own TestClient module against anyio. Not our call site;
  # drop this line once starlette stops importing the deprecated alias.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
